version: '3.8'

services:
  nginx:
    container_name: task_management_api_nginx
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    ports:
      - "${HTTP_PORT}:80"
    volumes:
      - .:/var/www
    depends_on:
      - php
      - mysql

  php:
    container_name: task_management_api_php
    build:
      context: .
      dockerfile: docker/php-fpm/Dockerfile
    volumes:
      - .:/var/www
    depends_on:
      - mysql

  mysql:
    container_name: task_management_api_mysql
    build:
      context: .
      dockerfile: docker/mysql/Dockerfile
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    container_name: task_management_api_redis
    build:
      context: ./docker/redis
      dockerfile: Dockerfile
    restart: always
    environment:
       REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data

volumes:
  mysql_data:
  redis_data:
